<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELIZA Implementations</title>
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<style>
:root { --bg:#faf9f6; --surface:#fff; --surface-2:#f1efe9; --text:#1d1c1a; --dim:#5f5b53; --faint:#8b867c; --line:#dcd8cf;
  --accent:#8a4b12; --held:#2f6f4f; --printed:#3b5f99; --attested:#8a6d1f; --lost:#9a3b3b; --linked:#6b4f99;
  --onlyA:#f6dcd8; --onlyB:#d9efe0; --diff:#fff1c9; }
@media (prefers-color-scheme: dark) { :root { --bg:#17181a; --surface:#1f2023; --surface-2:#26282c; --text:#e8e6e1; --dim:#b2ada3; --faint:#8a857b; --line:#3a3c40;
  --accent:#e0a060; --held:#6fbf8f; --printed:#8fb0e8; --attested:#d8b860; --lost:#e08a8a; --linked:#b89ae8;
  --onlyA:#4a2a28; --onlyB:#1f3d2b; --diff:#4a3f1c; } }
* { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
header { position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap }
h1 { font-size:16px; margin:0 8px 0 0 } .note { color:var(--faint); font-size:12px }
nav button { border:1px solid var(--line); background:var(--surface-2); color:var(--text); padding:5px 12px; cursor:pointer; font:inherit }
nav button:first-child { border-radius:6px 0 0 6px } nav button:last-child { border-radius:0 6px 6px 0 } nav button.on { background:var(--accent); color:var(--bg); border-color:var(--accent) }
main { padding:16px; max-width:1600px; margin:0 auto }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center } .filters select, .filters input { font:inherit; padding:4px 6px; background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:5px }
.btn { font:inherit; font-size:13px; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:5px; padding:3px 10px; cursor:pointer } .btn.on { border-color:var(--accent); color:var(--accent); font-weight:600 }
table { border-collapse:collapse; width:100% } th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top } th { color:var(--dim); font-weight:600; position:sticky; top:52px; background:var(--bg) }
th[data-sort] { cursor:pointer } th[data-sort]:hover { color:var(--accent) }
tr.row { cursor:pointer } tr.row:hover { background:var(--surface-2) } .mono { font-family:ui-monospace, Menlo, monospace; font-size:12.5px }
.chip { display:inline-block; padding:0 7px; border-radius:9px; font-size:11.5px; border:1px solid currentColor; white-space:nowrap }
.st-held{color:var(--held)} .st-printed{color:var(--printed)} .st-attested{color:var(--attested)} .st-lost{color:var(--lost)} .st-linked{color:var(--linked)}
.fam { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle }
#tree { overflow:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface) } #tree svg text { fill:var(--text); font-size:11px }
.legend { display:flex; gap:14px; flex-wrap:wrap; margin:8px 0; font-size:12px; color:var(--dim) } .legend svg { vertical-align:middle }
.yes { color:var(--held); font-weight:700 } .no { color:var(--lost) } .unk { color:var(--faint) } td.c { text-align:center }
.card { background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:12px }
.card summary { padding:10px 14px; cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; list-style:none } .card summary::-webkit-details-marker { display:none }
.card summary .mono { color:var(--faint) } .card summary .chip { grid-column:2; grid-row:1; justify-self:end } .card summary b { grid-column:1 / -1; font-size:15px; line-height:1.35 } .card .body { padding:0 14px 14px } .grid { display:grid; grid-template-columns:max-content 1fr; gap:3px 14px; margin:6px 0 10px } .grid div:nth-child(odd) { color:var(--faint) }
.lineage { display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; margin:10px 0; padding:10px; background:var(--surface-2); border-radius:8px }
.lineage .col { display:flex; flex-direction:column; gap:6px; min-width:200px; flex:1 } .lineage .self { flex:0 0 auto; align-self:center; font-weight:700; padding:6px 10px; border:2px solid var(--accent); border-radius:8px; max-width:280px }
.lineage .arrow { align-self:center; color:var(--faint); font-size:20px } .nb { padding:5px 8px; border-radius:6px; background:var(--surface); cursor:pointer; font-size:12.5px }
.nb.established { border:1.5px solid var(--dim) } .nb.probable { border:1.5px dashed var(--dim) } .nb.possible { border:1.5px dotted var(--dim) } .nb small { display:block; color:var(--faint) }
.feats { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 } .desc { white-space:pre-wrap; max-width:900px }
.actions { display:flex; gap:8px; margin:6px 0 2px }
.source { background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden } .source .bar { padding:7px 12px; border-bottom:1px solid var(--line); display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--surface-2) }
.source .bar button { font:inherit; font-size:12px; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:5px; padding:2px 8px; cursor:pointer } .source .bar button.on { border-color:var(--accent); color:var(--accent) }
.private { color:var(--attested); font-size:12px }
pre.code { margin:0; padding:10px 0; overflow:auto; max-height:75vh; font:12.5px/1.45 ui-monospace, Menlo, monospace; counter-reset:ln }
pre.code span { display:block; padding:0 12px 0 0; white-space:pre } pre.code span::before { counter-increment:ln; content:counter(ln); display:inline-block; width:4.5em; padding-right:1em; text-align:right; color:var(--faint); user-select:none }
.held-privately { padding:24px; color:var(--dim) } .empty { padding:30px; color:var(--faint) } a { color:var(--accent) }
.cmp-pick { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:start; margin-bottom:12px }
.cmp-pick .side { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px }
.cmp-pick .side input { width:100%; font:inherit; padding:4px 6px; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:5px }
.cmp-pick .side .t { font-weight:600; margin:6px 0 4px } .cmp-pick .mid { align-self:center }
.ftab td.d { background:var(--diff); font-weight:600 }
.par { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; align-items:stretch } .par > * { min-width:0; margin:0 }
.par > .card { height:100% } .par .source pre.code { max-height:70vh }
@media (max-width:800px) { .par { grid-template-columns:minmax(0,1fr) } .par .a1 { order:1 } .par .a2 { order:2 } .par .b1 { order:3 } .par .b2 { order:4 } } .par .pane pre.code { max-height:70vh }
.diff { width:100%; border-collapse:collapse; font:12px/1.4 ui-monospace, Menlo, monospace } .diff td { border:0; padding:0 6px; white-space:pre; vertical-align:top; overflow:hidden; max-width:0; text-overflow:ellipsis }
.diff { table-layout:fixed } .diff td.n { width:3.5em; max-width:none; overflow:visible; text-overflow:clip; text-align:right; color:var(--faint); user-select:none } .diff tr.a td.ta { background:var(--onlyA) } .diff tr.b td.tb { background:var(--onlyB) }
.diffwrap { max-height:75vh; overflow:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface) }
.summary { margin:8px 0; color:var(--dim) } .key span { padding:0 6px; margin-right:8px }
@media (max-width:800px) { .par, .cmp-pick { grid-template-columns:1fr } th:nth-child(5), td:nth-child(5), th:nth-child(6), td:nth-child(6) { display:none } }
</style>
</head>
<body>
<header>
  <h1>ELIZA Implementations</h1>
  <nav><button data-v="list" class="on">List</button><button data-v="read">Read</button><button data-v="tree">Tree</button><button data-v="matrix">Matrix</button><button data-v="compare">Compare</button></nav>
  <span class="note" id="count"></span>
  <span class="note">Every known implementation of ELIZA, with its lineage. Part of the <a href="../">ELIZA research bench</a>.</span>
</header>
<main id="main"><p class="empty">Loading…</p></main>
<footer id="credit" class="note" style="max-width:1600px;margin:0 auto;padding:4px 16px 24px">Many of the implementations here were collected and shared by <a href="http://shrager.org/" target="_blank" rel="noopener">Jeff Shrager</a> at <a href="https://elizagen.org/" target="_blank" rel="noopener">ELIZAGEN</a>, and are held with his permission.</footer>
<script>
(function () {
  'use strict';
  var CAT, BY = {}, view = 'list', cur = null, F = { fam: '', st: '', pub: '', q: '' }, SORT = { k: 'date', dir: 1 }, SHOWF = false, CMP = { a: null, b: null }, PICK = null;
  var CATURL = new URLSearchParams(location.search).get('cat') || 'catalogue.json', BASE = CATURL.replace(/[^/]*$/, '');
  var ROOTS = { 'v:1965b': 'ELIZA 1965b, the MAD-SLIP source', 'v:1966': 'ELIZA as described in CACM, January 1966', 'v:doctor': 'DOCTOR, the script printed in CACM, 1966' };
  var FAMORDER = [], PAL = ['#b5651d', '#2f6f8f', '#7a4f9a', '#6f7f3f', '#9a3b5f', '#3f7f6f', '#8a6d1f', '#555'];
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var $ = function (s) { return document.querySelector(s); }, $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  function year(r) { var m = String(r.date || '').match(/(1[89]\d\d|20\d\d)/); return m ? +m[1] : null; }
  function vmap(c) { var v = (CAT.variorum || {})[c] || (CAT.variorum || {})[c.replace(/^v:/, '')]; return v == null ? null : typeof v === 'string' ? { label: v } : v; }
  function rootLabel(c) { var v = vmap(c); return v ? (v.label || v.title || c) + (v.date ? ' (' + v.date + ')' : '') : ROOTS[c] || c.replace(/^v:/, 'variorum: '); }
  function famName(id) { var f = (CAT.families || []).filter(function (x) { return x.id === id; })[0]; return f ? f.name : id; }
  function famColour(f) { var i = FAMORDER.indexOf(f); return i < 0 ? '#888' : PAL[i % PAL.length]; }
  function label(code) { return BY[code] ? BY[code].title : /^v:/.test(code) ? rootLabel(code) : code; }
  function chip(st) { return '<span class="chip st-' + esc(st) + '">' + esc(st) + '</span>'; }
  function dot(fam) { return '<span class="fam" style="background:' + famColour(fam) + '"></span>'; }
  function feats() { return CAT.features || []; }
  function fval(v, k) { return v == null ? '?' : v === true ? '✓' : v === false ? '✗' : String(v); }
  function fcls(v) { return v == null ? 'unk' : v === false || v === 'no BUT' ? 'no' : 'yes'; }

  // the files an entry can show: published ones, or (locally only) the private copies awaiting clearance
  function filesOf(r) {
    if (r.file) return [{ url: BASE + r.file, label: 'Main file', mime: r.mime, name: r.file }].concat((r.alts || []).filter(function (a) { return a.file; }).map(function (a) { return { url: BASE + a.file, label: a.label || a.file.split('/').pop(), mime: a.mime, name: a.file }; }));
    return (r._localPrivateFiles || []).map(function (n, i) { return { url: BASE + 'private/' + n, label: (i ? 'Alternate ' + i : 'Main file') + ' (private copy)', mime: '', name: n, priv: true }; });
  }
  var TEXT = /\.(l|el|lsp|lisp|mac|for|f|asm|s|ez|spec|txt|bas|py|cpp|java|pl|pm|php|cbl|awk|tcl|lg|p|pli|pas|tec|rls|mad|ascii|eli|scr|js|json|html?|listing\.txt|c|z80|plisp|runbasic|c64basic)$/i;
  function isText(f) { return /^text\/|json|javascript/.test(f.mime || '') || TEXT.test(f.name || ''); }
  function textFileOf(r) { return filesOf(r).filter(function (f) { return isText(f) && !/\.html?$/i.test(f.name); })[0] || filesOf(r).filter(isText)[0] || null; }
  function langFam(s) { s = String(s || '').toLowerCase(); return /lisp/.test(s) ? 'lisp' : /basic/.test(s) ? 'basic' : /eliza script/.test(s) ? 'eliza script' : s; }

  // ---------- List (with feature columns behind a toggle) ----------
  function filtered() {
    var q = F.q.toLowerCase();
    return CAT.items.filter(function (r) {
      if (F.fam && r.family !== F.fam) return false; if (F.st && r.status !== F.st) return false; if (F.pub && r.publish !== F.pub) return false;
      if (q && [r.code, r.title, r.creator, r.progLanguage, r.machine, r.date, r.description].join(' ').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function sortKey(r, k) {
    if (k === 'date') return year(r) || 9999;
    if (k.indexOf('f:') === 0) { var v = (r.features || {})[k.slice(2)]; return v == null ? 'zz' : String(v); }
    return String(k === 'family' ? famName(r.family) : r[k] || '').toLowerCase();
  }
  function sorted(l) { return l.sort(function (a, b) { var x = sortKey(a, SORT.k), y = sortKey(b, SORT.k); return (x < y ? -1 : x > y ? 1 : String(a.title).localeCompare(b.title)) * SORT.dir; }); }
  function opts(list, val, all) { return '<option value="">' + all + '</option>' + list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
  function filters(extra) {
    return '<div class="filters"><input id="q" type="search" placeholder="Find (title, author, language, machine)" value="' + esc(F.q) + '">' +
      '<select id="ffam">' + opts(FAMORDER.map(function (f) { return [f, famName(f)]; }), F.fam, 'Every family') + '</select>' +
      '<select id="fst">' + opts((CAT.statuses || []).map(function (s) { return [s.id, s.id]; }), F.st, 'Every status') + '</select>' +
      '<select id="fpub">' + opts([['files', 'Files published'], ['entry', 'Entry only']], F.pub, 'Published or not') + '</select>' + (extra || '') + '</div>';
  }
  function wireFilters(after) {
    $('#q').oninput = function (e) { F.q = e.target.value; after(); var q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); };
    $('#ffam').onchange = function (e) { F.fam = e.target.value; after(); }; $('#fst').onchange = function (e) { F.st = e.target.value; after(); }; $('#fpub').onchange = function (e) { F.pub = e.target.value; after(); };
  }
  function cell(v, k) {
    if (v == null) return '<td class="c unk">?</td>';
    if (k === 'delimit') return v === 'no BUT' ? '<td class="c no">no BUT</td>' : /BUT/.test(v) ? '<td class="c yes">' + esc(v) + '</td>' : '<td class="c">' + esc(v) + '</td>';
    if (typeof v === 'number' || typeof v === 'string') return '<td class="c">' + esc(v) + '</td>';
    return v ? '<td class="c yes">✓</td>' : '<td class="c no">✗</td>';
  }
  function list() {
    var l = sorted(filtered()), fs = feats();
    var cols = [['code', 'Code'], ['date', 'Date'], ['title', 'Title'], ['progLanguage', 'Language'], ['machine', 'Machine'], ['family', 'Family'], ['status', 'Status'], ['publish', 'Files']];
    var head = cols.map(function (c) { return '<th data-sort="' + c[0] + '">' + c[1] + (SORT.k === c[0] ? (SORT.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>'; }).join('') +
      (SHOWF ? fs.map(function (f) { return '<th data-sort="f:' + esc(f.id) + '" title="' + esc(f.note) + '">' + esc(f.label) + (SORT.k === 'f:' + f.id ? (SORT.dir > 0 ? ' ▲' : ' ▼') : '') + '</th>'; }).join('') : '');
    $('#main').innerHTML = filters('<button class="btn' + (SHOWF ? ' on' : '') + '" id="tf">Features</button>') + '<table><thead><tr>' + head + '</tr></thead><tbody>' +
      l.map(function (r) {
        return '<tr class="row" data-code="' + esc(r.code) + '"><td class="mono">' + esc(r.code) + '</td><td>' + esc(r.date) + '</td><td>' + esc(r.title) + '</td><td>' + esc(r.progLanguage) + '</td><td>' + esc(r.machine) + '</td><td>' + dot(r.family) + esc(famName(r.family)) + '</td><td>' + chip(r.status) + '</td><td>' + (r.publish === 'files' ? 'published' : '<span class="unk">private</span>') + '</td>' +
          (SHOWF ? fs.map(function (f) { return cell((r.features || {})[f.id], f.id); }).join('') : '') + '</tr>';
      }).join('') + '</tbody></table>';
    $('#count').textContent = l.length + ' of ' + CAT.items.length;
    wireFilters(list);
    $('#tf').onclick = function () { SHOWF = !SHOWF; list(); };
    $$('th[data-sort]').forEach(function (th) { th.onclick = function () { var k = th.dataset.sort; SORT = { k: k, dir: SORT.k === k ? -SORT.dir : 1 }; list(); }; });
    rows();
  }
  function rows() { $$('[data-code]').forEach(function (el) { if (el.dataset.code) el.onclick = function () { pickOrOpen(el.dataset.code); }; }); }
  function pickOrOpen(code) {
    if (!BY[code]) return;
    if (PICK) { CMP[PICK] = code; PICK = null; go('compare'); return; }
    cur = code; go('read'); window.scrollTo(0, 0);
  }

  // ---------- Read ----------
  function nb(code, rel, conf, via, ev) {
    return '<div class="nb ' + esc(conf || 'established') + '" data-code="' + esc(BY[code] ? code : '') + '" title="' + esc(ev || '') + '">' + esc(label(code)) + '<small>' + esc([rel, via ? 'via ' + via : '', conf].filter(Boolean).join(' · ')) + '</small></div>';
  }
  function card(r, open) {
    var fs = feats();
    var fchips = fs.map(function (f) { var v = r.features ? r.features[f.id] : null; return '<span class="chip ' + fcls(v) + '" title="' + esc(f.note) + '">' + esc(f.label) + ' ' + esc(fval(v)) + '</span>'; }).join('');
    var parents = r.parents.map(function (p) { return nb(p.code, p.relation, p.confidence, p.via, p.evidence); }).join('') || '<div class="nb"><small>no declared parent</small></div>';
    var kids = (r.children || []).map(function (c) { var k = BY[c], p = k && k.parents.filter(function (x) { return x.code === r.code; })[0]; return nb(c, p && p.relation, p && p.confidence, p && p.via, p && p.evidence); }).join('') || '<div class="nb"><small>no known descendant</small></div>';
    var meta = [['Date', r.date + (r.dateBasis ? ' (' + r.dateBasis + ')' : '')], ['Author', r.creator], ['Language', r.progLanguage], ['Machine', r.machine], ['OS', r.os], ['Family', famName(r.family)],
      ['Runs on', (r.runsOn || []).map(label).join('; ')], ['Paratexts', (r.paratexts || []).join(', ')], ['Files', r.publish === 'files' ? 'published' + (r.clearance ? ' (' + r.clearance.basis + ')' : '') : 'held privately' + (r.heldAt && !/^(NEW:|private$)/.test(r.heldAt) ? ' at ' + r.heldAt : ', awaiting clearance')],
      ['Rights', r.rights], ['Source', r.source]].filter(function (x) { return x[1]; });
    return '<details class="card"' + (open ? ' open' : '') + '><summary><span class="mono">' + esc(r.code) + '</span><b>' + esc(r.title) + '</b>' + chip(r.status) + '</summary><div class="body">' +
      '<div class="grid">' + meta.map(function (m) { return '<div>' + esc(m[0]) + '</div><div>' + esc(m[1]) + '</div>'; }).join('') + '</div>' +
      '<div class="lineage"><div class="col">' + parents + '</div><div class="arrow">→</div><div class="self">' + esc(r.title) + '</div><div class="arrow">→</div><div class="col">' + kids + '</div></div>' +
      '<div class="feats">' + fchips + '</div><div class="desc">' + esc(r.description) + '</div></div></details>';
  }
  function emptyNote(r) {
    return r.heldAt ? (/^(NEW:|private$)/.test(r.heldAt) ? 'The project holds a copy of this file privately until its publication is cleared.' : 'File held privately: ' + esc(r.heldAt)) : r.status === 'printed' ? 'The program text is in print: ' + esc((r.paratexts || []).join(', ')) :
      r.status === 'linked' ? 'Held elsewhere: <a href="' + esc(r.archiveUrl || r.url || '') + '" target="_blank">' + esc(r.archiveUrl || r.url || '') + '</a>' : 'No copy is held.';
  }
  function showFile(el, f) {
    if (/^image\//.test(f.mime || '') || /\.(png|jpe?g|gif)$/i.test(f.name)) { el.innerHTML = '<img src="' + esc(f.url) + '" style="max-width:100%">'; return; }
    if (/pdf/.test(f.mime || '') || /\.pdf$/i.test(f.name)) { el.innerHTML = '<p class="held-privately"><a href="' + esc(f.url) + '" target="_blank">Open the PDF</a></p>'; return; }
    if (isText(f)) {
      fetch(f.url).then(function (x) { if (!x.ok) throw 0; return x.text(); }).then(function (t) { el.innerHTML = '<pre class="code">' + t.replace(/\r/g, '').split('\n').map(function (l) { return '<span>' + esc(l) + '</span>'; }).join('') + '</pre>'; }, function () { el.innerHTML = '<p class="held-privately">Could not read the file.</p>'; });
      return;
    }
    el.innerHTML = '<p class="held-privately">A binary file (' + esc(f.mime || f.name.split('.').pop()) + '). <a href="' + esc(f.url) + '" download>Download it</a>.</p>';
  }
  function source(r, id) {
    var files = filesOf(r);
    var html = '<div class="source"><div class="bar">' + (files.length ? files.map(function (f, i) { return '<button data-f="' + i + '"' + (i ? '' : ' class="on"') + '>' + esc(f.label) + '</button>'; }).join('') + (files[0].priv ? ' <span class="private">private copy, shown locally for testing; not published</span>' : '') : '<span class="unk">No file to show</span>') + '</div><div id="' + id + '"></div></div>';
    return { html: html, wire: function () {
      var el = document.getElementById(id); if (!files.length) { el.innerHTML = '<p class="held-privately">' + emptyNote(r) + '</p>'; return; }
      var bar = el.previousElementSibling;

  // ---------- Matrix: every implementation against the features, grouped by family ----------

  // ---------- Compare ----------
  function lcsAlign(A, B) {
    var n = A.length, m = B.length, i, j, W = m + 1, L = new Uint16Array((n + 1) * (m + 1));

      if ((c === '/' && !bbn) || (c === '%' && bbn)) { i++; continue; }

    Promise.all([ta, tb].map(function (f) { return fetch(f.url).then(function (x) { if (!x.ok) throw 0; return x.text(); }); })).then(function (tt) {
      var la = tt[0].replace(/\r/g, '').split('\n'), lb = tt[1].replace(/\r/g, '').split('\n');
      if (la.length * lb.length > 8e6) { parallel(body, A, B, 'The texts are too long to align line by line here, so they are shown side by side.'); return; }
      var fun = langFam(A.progLanguage) === 'lisp' ? byFunction(tt[0], tt[1]) : null;
      var al = lcsAlign(la.map(norm), lb.map(norm)), same = al.filter(function (x) { return x[0] === '='; }).length, oa = al.filter(function (x) { return x[0] === 'a'; }).length, ob = al.filter(function (x) { return x[0] === 'b'; }).length;

        (ta.priv || tb.priv ? '<span class="private">Includes a private copy, shown locally for testing.</span>' : '') + '</p>' +

          '<table class="ftab"><thead><tr><th>Definition</th><th>In A</th><th>In B</th><th>Similarity</th><th></th></tr></thead><tbody>' + fun.rows.map(function (r) {
            return '<tr><td class="mono">' + esc(r.k) + '</td><td class="c">' + (r.a ? r.a.length + ' tokens' : '<span class="unk">·</span>') + '</td><td class="c">' + (r.b ? r.b.length + ' tokens' : '<span class="unk">·</span>') + '</td><td class="c">' + (r.s == null ? '' : Math.round(r.s * 100) + '%') + '</td><td class="' + (r.st === 'identical' ? 'yes' : r.st === 'changed' ? '' : 'no') + '">' + esc(r.st) + '</td></tr>';
