<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>ELIZA Implementations</title>
<meta name="robots" content="noindex">
<script>
// Implementations is now a tab of the bench; links to this page keep working: the old parameters
// (view, code, a, b, features, fam, status) become the tab's (iv, ic, ia, ib, ifeat, ifam, ist).
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams(), map = { view: 'iv', code: 'ic', a: 'ia', b: 'ib', features: 'ifeat', fam: 'ifam', status: 'ist' };
  out.set('tab', 'implementations');
  Object.keys(map).forEach(function (k) { if (q.get(k)) out.set(map[k], q.get(k)); });
  location.replace('../index.html?' + out.toString());
})();
</script>
</head>
<body><p><a href="../index.html?tab=implementations">ELIZA Implementations</a>, in the research bench.</p></body>
